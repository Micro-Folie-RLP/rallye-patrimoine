<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rallye Patrimoine</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

</head>

<body>

<!-- Écran d'accueil animé -->
<div id="ecran-logo">

    <div class="logo-animation">

        <img src="Blason RLP_nobg.jpg" alt="Blason de la commune">

        <p>Rallye Patrimoine</p>

    </div>

</div>


<div class="container">

    <header>

        <h1>🌿 Rallye Patrimoine</h1>

        <p class="sous-titre">
            Journées Européennes du Patrimoine
        </p>

    </header>


    <section class="progression">

        <p>Étape <strong>1</strong> sur <strong>11</strong></p>

        <div class="barre">

            <div class="remplissage"></div>

        </div>

    </section>


    <section class="carte">

        <img src="images/mediatheque.jpg" alt="Illustration">

        <h2>Médiathèque Bernard Pivot</h2>

        <p>

Ici apparaîtra bientôt le texte de ton PDF.

        </p>

    </section>


    <section class="defi">

        <h3>🎯 Défi</h3>

        <p>

Ici apparaîtra le défi.

        </p>

    </section>


    <div class="navigation">

    <button id="precedent">
    ❮
</button>

    <button id="suivant">
        J'ai réalisé mon défi
    </button>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
